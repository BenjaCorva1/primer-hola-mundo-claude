<title>Harborline</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap"
  rel="stylesheet"
/>
<style>
  :root {
    --ground: #f4f7f6;
    --surface: #ffffff;
    --surface-2: #eef2f0;
    --surface-3: #e5eae8;
    --line: #dce4e1;
    --line-soft: #e9efec;
    --ink: #182422;
    --ink-soft: #57635f;
    --ink-faint: #8b9691;

    --accent: #0e6b59;
    --accent-strong: #0a5647;
    --accent-ink: #ffffff;
    --accent-soft: #e0f0ea;
    --accent-soft-ink: #0e6b59;
    --focus-ring: rgba(14, 107, 89, 0.35);

    --status-new-bg: #e7eefb;
    --status-new-ink: #2b57a6;
    --status-open-bg: #fcefda;
    --status-open-ink: #9a6317;
    --status-pending-bg: #ede7fb;
    --status-pending-ink: #5d45b4;
    --status-solved-bg: #e1f3e6;
    --status-solved-ink: #1e7a42;

    --priority-urgent: #c0392e;
    --priority-high: #b7791f;
    --priority-normal: #6b756f;
    --priority-low: #8b9691;

    --bubble-customer-bg: #f1f4f3;
    --bubble-agent-bg: #e0f0ea;
    --bubble-ink: #182422;

    --avatar-a: #0e6b59;
    --avatar-a-ink: #ffffff;
    --avatar-b: #2b57a6;
    --avatar-b-ink: #ffffff;
    --avatar-c: #9a6317;
    --avatar-c-ink: #ffffff;
    --avatar-d: #7a4fb0;
    --avatar-d-ink: #ffffff;

    --shadow-1: 0 1px 2px rgba(24, 36, 34, 0.07);
    --shadow-2: 0 10px 28px rgba(24, 36, 34, 0.14);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #0f1917;
      --surface: #16211e;
      --surface-2: #1b2723;
      --surface-3: #213029;
      --line: #28352f;
      --line-soft: #202b26;
      --ink: #e7eeec;
      --ink-soft: #9fada8;
      --ink-faint: #6c7a75;

      --accent: #45c4a5;
      --accent-strong: #5fd6b8;
      --accent-ink: #0a1613;
      --accent-soft: #1c3630;
      --accent-soft-ink: #7fe0c4;
      --focus-ring: rgba(69, 196, 165, 0.4);

      --status-new-bg: #1e2c42;
      --status-new-ink: #8fb4ee;
      --status-open-bg: #3a2e17;
      --status-open-ink: #e8b85e;
      --status-pending-bg: #2c2440;
      --status-pending-ink: #bba4f2;
      --status-solved-bg: #1b3324;
      --status-solved-ink: #7ed99b;

      --priority-urgent: #e2685b;
      --priority-high: #e0b15e;
      --priority-normal: #a9b3ae;
      --priority-low: #6c7a75;

      --bubble-customer-bg: #1b2723;
      --bubble-agent-bg: #1c3630;
      --bubble-ink: #e7eeec;

      --avatar-a: #45c4a5;
      --avatar-a-ink: #0a1613;
      --avatar-b: #6c9bee;
      --avatar-b-ink: #0a1613;
      --avatar-c: #e0b15e;
      --avatar-c-ink: #0a1613;
      --avatar-d: #b79aee;
      --avatar-d-ink: #0a1613;

      --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.35);
      --shadow-2: 0 14px 32px rgba(0, 0, 0, 0.5);
    }
  }

  :root[data-theme="dark"] {
    --ground: #0f1917;
    --surface: #16211e;
    --surface-2: #1b2723;
    --surface-3: #213029;
    --line: #28352f;
    --line-soft: #202b26;
    --ink: #e7eeec;
    --ink-soft: #9fada8;
    --ink-faint: #6c7a75;

    --accent: #45c4a5;
    --accent-strong: #5fd6b8;
    --accent-ink: #0a1613;
    --accent-soft: #1c3630;
    --accent-soft-ink: #7fe0c4;
    --focus-ring: rgba(69, 196, 165, 0.4);

    --status-new-bg: #1e2c42;
    --status-new-ink: #8fb4ee;
    --status-open-bg: #3a2e17;
    --status-open-ink: #e8b85e;
    --status-pending-bg: #2c2440;
    --status-pending-ink: #bba4f2;
    --status-solved-bg: #1b3324;
    --status-solved-ink: #7ed99b;

    --priority-urgent: #e2685b;
    --priority-high: #e0b15e;
    --priority-normal: #a9b3ae;
    --priority-low: #6c7a75;

    --bubble-customer-bg: #1b2723;
    --bubble-agent-bg: #1c3630;
    --bubble-ink: #e7eeec;

    --avatar-a: #45c4a5;
    --avatar-a-ink: #0a1613;
    --avatar-b: #6c9bee;
    --avatar-b-ink: #0a1613;
    --avatar-c: #e0b15e;
    --avatar-c-ink: #0a1613;
    --avatar-d: #b79aee;
    --avatar-d-ink: #0a1613;

    --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.35);
    --shadow-2: 0 14px 32px rgba(0, 0, 0, 0.5);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: "Public Sans", -apple-system, "Segoe UI", sans-serif;
    font-size: 13.5px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }
  .mono {
    font-family: "IBM Plex Mono", "SFMono-Regular", Consolas, monospace;
  }
  button, input, select, textarea { font-family: inherit; color: inherit; }
  button { cursor: pointer; }
  ul { list-style: none; margin: 0; padding: 0; }
  svg { display: block; }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }

  /* ---------- layout ---------- */
  .app {
    height: 100vh;
    display: grid;
    grid-template-columns: 60px 320px 1fr 288px;
    grid-template-rows: 54px 1fr;
    grid-template-areas:
      "rail topbar topbar topbar"
      "rail list detail context";
    background: var(--ground);
  }

  @media (max-width: 1100px) {
    .app { grid-template-columns: 60px 300px 1fr 0; }
    .context-pane { display: none; }
  }

  @media (max-width: 760px) {
    .app { grid-template-columns: 52px 1fr 0 0; }
    .list-pane { border-right: none; }
    .detail-pane {
      position: fixed;
      inset: 54px 0 0 52px;
      z-index: 20;
      transform: translateX(100%);
      transition: transform 0.22s ease;
      box-shadow: var(--shadow-2);
    }
    body.detail-open .detail-pane { transform: translateX(0); }
    .back-btn { display: inline-flex !important; }
  }

  /* ---------- rail ---------- */
  .rail {
    grid-area: rail;
    background: var(--surface-2);
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 10px 0;
    gap: 4px;
  }
  .rail-brand {
    width: 34px;
    height: 34px;
    border-radius: 9px;
    background: var(--accent);
    color: var(--accent-ink);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 10px;
    flex: none;
  }
  .rail-nav {
    display: flex;
    flex-direction: column;
    gap: 2px;
    flex: 1;
  }
  .rail-bottom {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .rail-btn {
    width: 40px;
    height: 40px;
    border: none;
    background: transparent;
    border-radius: 9px;
    color: var(--ink-faint);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    transition: background-color 0.12s ease, color 0.12s ease;
  }
  .rail-btn:hover { background: var(--surface-3); color: var(--ink); }
  .rail-btn.is-active {
    background: var(--accent-soft);
    color: var(--accent-soft-ink);
  }
  .rail-btn.is-active::before {
    content: "";
    position: absolute;
    left: -10px;
    top: 8px;
    bottom: 8px;
    width: 3px;
    border-radius: 0 3px 3px 0;
    background: var(--accent);
  }

  /* ---------- topbar ---------- */
  .topbar {
    grid-area: topbar;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 0 18px;
    min-width: 0;
  }
  .crumb {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: var(--ink-soft);
    white-space: nowrap;
  }
  .crumb-current { color: var(--ink); font-weight: 600; }
  .crumb svg { color: var(--ink-faint); }
  .search {
    flex: 1;
    max-width: 420px;
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 0 10px;
    height: 32px;
    transition: border-color 0.12s ease, box-shadow 0.12s ease;
  }
  .search:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--focus-ring);
  }
  .search svg { color: var(--ink-faint); flex: none; }
  .search input {
    border: none;
    background: transparent;
    outline: none;
    width: 100%;
    font-size: 13px;
    color: var(--ink);
  }
  .search input::placeholder { color: var(--ink-faint); }
  .topbar-right {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-left: auto;
    flex: none;
  }
  .icon-btn {
    width: 32px;
    height: 32px;
    border: none;
    background: transparent;
    border-radius: 7px;
    color: var(--ink-soft);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .icon-btn:hover { background: var(--surface-2); color: var(--ink); }
  .icon-btn .ping {
    position: absolute;
    top: 6px;
    right: 6px;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--priority-urgent);
    border: 1.5px solid var(--surface);
  }
  .agent-chip {
    display: flex;
    align-items: center;
    gap: 8px;
    padding-left: 8px;
    border-left: 1px solid var(--line);
  }
  .agent-meta { display: flex; flex-direction: column; line-height: 1.25; }
  .agent-name { font-size: 12.5px; font-weight: 600; }
  .agent-status {
    font-size: 11px;
    color: var(--ink-soft);
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .dot-online {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--status-solved-ink);
    display: inline-block;
  }

  .avatar {
    flex: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    font-weight: 700;
    letter-spacing: 0.02em;
  }
  .avatar-a { background: var(--avatar-a); color: var(--avatar-a-ink); }
  .avatar-b { background: var(--avatar-b); color: var(--avatar-b-ink); }
  .avatar-c { background: var(--avatar-c); color: var(--avatar-c-ink); }
  .avatar-d { background: var(--avatar-d); color: var(--avatar-d-ink); }

  /* ---------- list pane ---------- */
  .list-pane {
    grid-area: list;
    background: var(--surface);
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .list-head { padding: 12px 14px 0; }
  .tabs {
    display: flex;
    gap: 2px;
    border-bottom: 1px solid var(--line);
    overflow-x: auto;
  }
  .tab {
    border: none;
    background: transparent;
    padding: 8px 10px 10px;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink-soft);
    border-bottom: 2px solid transparent;
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .tab:hover { color: var(--ink); }
  .tab.is-active { color: var(--accent-strong); border-bottom-color: var(--accent); }
  .tab .count {
    font-family: "IBM Plex Mono", monospace;
    font-size: 10.5px;
    background: var(--surface-3);
    color: var(--ink-soft);
    border-radius: 20px;
    padding: 1px 6px;
  }
  .tab.is-active .count { background: var(--accent-soft); color: var(--accent-soft-ink); }

  .ticket-list {
    flex: 1;
    overflow-y: auto;
  }
  .ticket-row {
    width: 100%;
    text-align: left;
    border: none;
    background: var(--surface);
    border-bottom: 1px solid var(--line-soft);
    border-left: 3px solid transparent;
    padding: 11px 14px;
    display: block;
    transition: background-color 0.12s ease;
  }
  .ticket-row:hover { background: var(--surface-2); }
  .ticket-row.is-active {
    background: var(--accent-soft);
    border-left-color: var(--accent);
  }
  .ticket-row[data-priority="urgent"] { border-left-color: var(--priority-urgent); }
  .ticket-row.is-active[data-priority="urgent"] { border-left-color: var(--priority-urgent); }
  .row-top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
  }
  .row-id { font-size: 11px; color: var(--ink-faint); }
  .row-time { font-size: 11px; color: var(--ink-faint); flex: none; }
  .row-subject {
    font-size: 13px;
    font-weight: 600;
    margin: 2px 0 3px;
    display: -webkit-box;
    -webkit-line-clamp: 1;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .row-snippet {
    font-size: 12px;
    color: var(--ink-soft);
    display: -webkit-box;
    -webkit-line-clamp: 1;
    -webkit-box-orient: vertical;
    overflow: hidden;
    margin-bottom: 6px;
  }
  .row-bottom { display: flex; align-items: center; gap: 6px; }
  .row-requester { font-size: 11.5px; color: var(--ink-soft); margin-right: auto; }

  .pill {
    font-size: 10.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    padding: 2.5px 7px;
    border-radius: 20px;
  }
  .pill[data-status="new"] { background: var(--status-new-bg); color: var(--status-new-ink); }
  .pill[data-status="open"] { background: var(--status-open-bg); color: var(--status-open-ink); }
  .pill[data-status="pending"] { background: var(--status-pending-bg); color: var(--status-pending-ink); }
  .pill[data-status="solved"] { background: var(--status-solved-bg); color: var(--status-solved-ink); }

  .priority-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    flex: none;
  }
  .priority-dot[data-priority="urgent"] { background: var(--priority-urgent); }
  .priority-dot[data-priority="high"] { background: var(--priority-high); }
  .priority-dot[data-priority="normal"] { background: var(--priority-normal); }
  .priority-dot[data-priority="low"] { background: var(--priority-low); }

  /* ---------- detail pane ---------- */
  .detail-pane {
    grid-area: detail;
    background: var(--ground);
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
  }
  .detail-header {
    background: var(--surface);
    border-bottom: 1px solid var(--line);
    padding: 14px 20px;
  }
  .back-btn {
    display: none;
    border: none;
    background: transparent;
    color: var(--ink-soft);
    align-items: center;
    gap: 4px;
    font-size: 12.5px;
    font-weight: 600;
    padding: 0 0 10px;
  }
  .detail-title-row {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
  }
  .detail-title {
    font-size: 18px;
    font-weight: 700;
    text-wrap: balance;
    margin: 0 0 3px;
  }
  .detail-subline {
    font-size: 12px;
    color: var(--ink-soft);
  }
  .detail-subline .mono { color: var(--ink-faint); }
  .detail-controls {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 12px;
    flex-wrap: wrap;
  }
  .chip-select {
    position: relative;
    display: inline-flex;
  }
  .chip-select select {
    appearance: none;
    border: 1px solid transparent;
    border-radius: 20px;
    padding: 4px 24px 4px 10px;
    font-size: 11.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    cursor: pointer;
  }
  .chip-select::after {
    content: "";
    position: absolute;
    right: 9px;
    top: 50%;
    width: 6px;
    height: 6px;
    border-right: 1.5px solid currentColor;
    border-bottom: 1.5px solid currentColor;
    transform: translateY(-65%) rotate(45deg);
    pointer-events: none;
    opacity: 0.6;
  }
  .chip-select[data-status="new"] select { background: var(--status-new-bg); color: var(--status-new-ink); }
  .chip-select[data-status="open"] select { background: var(--status-open-bg); color: var(--status-open-ink); }
  .chip-select[data-status="pending"] select { background: var(--status-pending-bg); color: var(--status-pending-ink); }
  .chip-select[data-status="solved"] select { background: var(--status-solved-bg); color: var(--status-solved-ink); }
  .chip-select[data-priority] select { background: var(--surface-3); color: var(--ink); }
  .priority-swatch {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    pointer-events: none;
  }
  .chip-select[data-priority] select { padding-left: 20px; }
  .chip-select select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .assignee {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--ink-soft);
    margin-left: 4px;
  }
  .assignee .avatar { width: 18px; height: 18px; font-size: 9px; }

  .conversation {
    flex: 1;
    overflow-y: auto;
    padding: 18px 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .msg { display: flex; gap: 10px; max-width: 74%; }
  .msg.from-agent { align-self: flex-end; flex-direction: row-reverse; }
  .msg .avatar { width: 26px; height: 26px; font-size: 10.5px; margin-top: 2px; }
  .msg-body { min-width: 0; }
  .msg-meta {
    display: flex;
    gap: 6px;
    align-items: baseline;
    font-size: 11px;
    color: var(--ink-faint);
    margin-bottom: 3px;
  }
  .msg.from-agent .msg-meta { flex-direction: row-reverse; }
  .msg-name { font-weight: 700; color: var(--ink-soft); }
  .msg-bubble {
    background: var(--bubble-customer-bg);
    color: var(--bubble-ink);
    padding: 9px 12px;
    border-radius: 12px 12px 12px 3px;
    font-size: 13px;
    line-height: 1.5;
  }
  .msg.from-agent .msg-bubble {
    background: var(--bubble-agent-bg);
    border-radius: 12px 12px 3px 12px;
  }
  .msg.is-note .msg-bubble {
    background: var(--status-open-bg);
    color: var(--status-open-ink);
    border-radius: 10px;
  }
  .msg.is-note .msg-name::after {
    content: "· nota interna";
    font-weight: 500;
    text-transform: none;
    margin-left: 4px;
  }

  .reply-box {
    background: var(--surface);
    border-top: 1px solid var(--line);
    padding: 12px 20px 14px;
  }
  .reply-tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 8px;
  }
  .reply-tab {
    border: none;
    background: transparent;
    font-size: 12px;
    font-weight: 700;
    padding: 5px 10px;
    border-radius: 20px;
    color: var(--ink-soft);
  }
  .reply-tab.is-active { background: var(--accent-soft); color: var(--accent-soft-ink); }
  .reply-tab[data-tab="note"].is-active { background: var(--status-open-bg); color: var(--status-open-ink); }
  .reply-field {
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--surface);
    transition: border-color 0.12s ease, box-shadow 0.12s ease;
  }
  .reply-field:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--focus-ring);
  }
  .reply-field textarea {
    width: 100%;
    border: none;
    outline: none;
    background: transparent;
    resize: vertical;
    min-height: 56px;
    padding: 10px 12px 4px;
    font-size: 13px;
    color: var(--ink);
  }
  .reply-field textarea::placeholder { color: var(--ink-faint); }
  .reply-toolbar {
    display: flex;
    align-items: center;
    gap: 2px;
    padding: 4px 8px 8px;
  }
  .fmt-btn {
    width: 26px;
    height: 26px;
    border: none;
    background: transparent;
    border-radius: 6px;
    color: var(--ink-faint);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .fmt-btn:hover { background: var(--surface-2); color: var(--ink-soft); }
  .reply-actions {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 8px;
  }
  .send-btn {
    border: none;
    background: var(--accent);
    color: var(--accent-ink);
    font-size: 12.5px;
    font-weight: 700;
    padding: 8px 16px;
    border-radius: 8px;
    transition: background-color 0.12s ease, opacity 0.12s ease;
  }
  .send-btn:hover:not(:disabled) { background: var(--accent-strong); }
  .send-btn:disabled { opacity: 0.4; cursor: default; }
  .reply-tab[data-tab="note"].is-active ~ .reply-actions .send-btn,
  #replyForm[data-tab="note"] .send-btn {
    background: var(--status-open-ink);
  }

  /* ---------- context pane ---------- */
  .context-pane {
    grid-area: context;
    background: var(--surface);
    border-left: 1px solid var(--line);
    overflow-y: auto;
    padding: 18px 16px;
  }
  .ctx-avatar {
    width: 52px;
    height: 52px;
    font-size: 18px;
    border-radius: 14px;
    margin-bottom: 10px;
  }
  .ctx-name { font-size: 15px; font-weight: 700; margin: 0 0 2px; }
  .ctx-email { font-size: 12px; color: var(--ink-soft); word-break: break-all; }
  .ctx-plan {
    display: inline-block;
    margin-top: 9px;
    font-size: 10.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    background: var(--accent-soft);
    color: var(--accent-soft-ink);
    padding: 3px 8px;
    border-radius: 20px;
  }
  .ctx-section {
    margin-top: 18px;
    padding-top: 14px;
    border-top: 1px solid var(--line-soft);
  }
  .ctx-label {
    font-size: 10.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--ink-faint);
    margin-bottom: 8px;
  }
  .ctx-row {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    font-size: 12.5px;
    padding: 4px 0;
  }
  .ctx-row dt { color: var(--ink-soft); }
  .ctx-row dd { margin: 0; font-weight: 600; text-align: right; }
  .ctx-tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .ctx-tag {
    font-size: 11px;
    background: var(--surface-2);
    border: 1px solid var(--line);
    color: var(--ink-soft);
    padding: 3px 8px;
    border-radius: 20px;
  }

  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-thumb { background: var(--surface-3); border-radius: 20px; border: 2px solid transparent; background-clip: content-box; }
  ::-webkit-scrollbar-track { background: transparent; }
</style>

<script>
  const AGENT = { name: "Mara Ibarra", initials: "MI", avatar: "avatar-a" };

  const STATUS_LABEL = { new: "Nuevo", open: "Abierto", pending: "Pendiente", solved: "Resuelto" };
  const PRIORITY_LABEL = { urgent: "Urgente", high: "Alta", normal: "Normal", low: "Baja" };

  const tickets = [
    {
      id: 4821, status: "open", priority: "high", updated: "hace 12 min",
      subject: "No puedo iniciar sesión después de restablecer la contraseña",
      requester: { name: "Elena Vásquez", initials: "EV", avatar: "avatar-a", email: "elena.vasquez@brightloop.io", company: "Brightloop", plan: "Pro", since: "marzo 2022", openCount: 1, totalCount: 4, tags: ["Inicio de sesión", "Cuenta"] },
      messages: [

      ],
    },
    {
      id: 4820, status: "pending", priority: "normal", updated: "hace 38 min",
      subject: "La factura no coincide con el precio del plan",
      requester: { name: "Tomasz Krawiec", initials: "TK", avatar: "avatar-b", email: "t.krawiec@fernbau.de", company: "Fernbau GmbH", plan: "Team", since: "enero 2023", openCount: 0, totalCount: 2, tags: ["Facturación"] },
      messages: [
        { from: "customer", time: "hace 50 min", text: "Nuestro plan es de $49/mes pero la última factura llegó por $63. ¿Hay algún cargo adicional que no veo reflejado en el panel?" },
        { from: "agent", time: "hace 38 min", text: "Estoy revisando el historial de facturación con el equipo de finanzas, te confirmo en las próximas horas." },
      ],
    },
    {
      id: 4818, status: "new", priority: "urgent", updated: "hace 1 h",
      subject: "La API devuelve error 429 en exportaciones masivas",
      requester: { name: "Priya Natarajan", initials: "PN", avatar: "avatar-c", email: "priya.n@quillstack.dev", company: "Quillstack", plan: "Enterprise", since: "julio 2021", openCount: 2, totalCount: 9, tags: ["API", "Urgente"] },
      messages: [
        { from: "customer", time: "hace 1 h", text: "Desde ayer todas nuestras exportaciones por lote fallan con 429 Too Many Requests, aunque no superamos el límite documentado de 100 req/min." },
      ],
    },
    {
      id: 4815, status: "open", priority: "low", updated: "hace 2 h",
      subject: "Sugerencia: modo oscuro para los informes",
      requester: { name: "Jonas Bergström", initials: "JB", avatar: "avatar-d", email: "jonas.b@nordvik.se", company: "Nordvik Studio", plan: "Pro", since: "noviembre 2023", openCount: 1, totalCount: 1, tags: ["Sugerencia"] },
      messages: [
        { from: "customer", time: "hace 2 h", text: "Sería genial tener modo oscuro en la sección de informes, la pasamos revisando dashboards de noche y el blanco cansa la vista." },
      ],
    },
    {
      id: 4809, status: "pending", priority: "normal", updated: "hace 3 h",
      subject: "Falta la última columna al exportar CSV",
      requester: { name: "Amara Chukwu", initials: "AC", avatar: "avatar-a", email: "amara.c@lentahealth.com", company: "Lenta Health", plan: "Team", since: "mayo 2022", openCount: 0, totalCount: 3, tags: ["Exportación", "Bug"] },
      messages: [
        { from: "customer", time: "hace 3 h", text: "Al exportar el reporte mensual, la columna “Total” no aparece en el CSV aunque sí se ve en la vista previa." },
        { from: "agent", time: "hace 3 h", text: "Confirmado, es un bug en el generador de CSV. Ya lo escalé al equipo de producto, te aviso apenas tengamos una corrección." },
      ],
    },
    {
      id: 4802, status: "solved", priority: "low", updated: "ayer",
      subject: "¿Cómo agrego a un compañero a mi espacio de trabajo?",
      requester: { name: "Diego Fuentes", initials: "DF", avatar: "avatar-b", email: "diego.fuentes@parral.mx", company: "Parral Studio", plan: "Starter", since: "agosto 2024", openCount: 0, totalCount: 1, tags: ["Onboarding"] },
      messages: [
        { from: "customer", time: "ayer", text: "Quiero invitar a dos personas más de mi equipo, ¿desde dónde lo hago?" },
        { from: "agent", time: "ayer", text: "Puedes hacerlo desde Configuración → Equipo → Invitar miembro. Les llegará un correo con el enlace de acceso." },
        { from: "customer", time: "ayer", text: "Perfecto, ¡ya quedó! Gracias." },
      ],
    },
    {
      id: 4795, status: "open", priority: "high", updated: "ayer",
      subject: "Solicitud de reembolso — cobro duplicado",
      requester: { name: "Hana Kobayashi", initials: "HK", avatar: "avatar-c", email: "hana.k@shizuka.jp", company: "Shizuka Co.", plan: "Pro", since: "febrero 2023", openCount: 0, totalCount: 2, tags: ["Facturación", "Reembolso"] },
      messages: [
        { from: "customer", time: "ayer", text: "Veo dos cargos de $29 el mismo día en mi tarjeta. Solo tengo una cuenta activa." },
        { from: "agent", time: "ayer", text: "Lamento el inconveniente, ya localicé el cargo duplicado del 21 de agosto y generé el reembolso. Debería reflejarse en 3–5 días hábiles." },
      ],
    },
    {
      id: 4788, status: "solved", priority: "normal", updated: "hace 2 d",
      subject: "La integración con Slack dejó de enviar alertas",
      requester: { name: "Callum O'Brien", initials: "CO", avatar: "avatar-d", email: "callum.obrien@brightfield.ie", company: "Brightfield Ltd.", plan: "Team", since: "septiembre 2022", openCount: 0, totalCount: 4, tags: ["Integraciones"] },
      messages: [
        { from: "customer", time: "hace 2 d", text: "Las alertas de nuevos tickets dejaron de llegar a nuestro canal #soporte desde el lunes." },
        { from: "agent", time: "hace 2 d", text: "El token de la integración había expirado. Ya generé uno nuevo y reconecté el canal, deberías volver a ver las alertas." },
      ],
    },
  ];

  const TABS = [
    { key: "unresolved", label: "Sin resolver" },
    { key: "new", label: "Nuevo" },
    { key: "open", label: "Abierto" },
    { key: "pending", label: "Pendiente" },
    { key: "solved", label: "Resuelto" },
  ];

  let activeTab = "unresolved";
  let query = "";
  let selectedId = tickets[0].id;
  let replyTab = "public";

  const tabsEl = document.getElementById("tabs");
  const listEl = document.getElementById("ticketList");
  const detailEl = document.getElementById("detailPane");
  const contextEl = document.getElementById("contextPane");
  const searchInput = document.getElementById("searchInput");

  function matchesTab(t) {
    if (activeTab === "unresolved") return t.status !== "solved";
    return t.status === activeTab;
  }
  function matchesQuery(t) {
    if (!query) return true;
    const q = query.toLowerCase();
    return t.subject.toLowerCase().includes(q) || t.requester.name.toLowerCase().includes(q);
  }
  function getTicket(id) { return tickets.find((t) => t.id === id); }

  function renderTabs() {
    tabsEl.innerHTML = TABS.map((tab) => {
      const count = tab.key === "unresolved"
        ? tickets.filter((t) => t.status !== "solved").length
        : tickets.filter((t) => t.status === tab.key).length;
      const active = tab.key === activeTab ? "is-active" : "";
      return `<button class="tab ${active}" data-tab="${tab.key}" role="tab">${tab.label} <span class="count mono">${count}</span></button>`;
    }).join("");
    tabsEl.querySelectorAll(".tab").forEach((btn) => {
      btn.addEventListener("click", () => {
        activeTab = btn.dataset.tab;
        renderTabs();
        renderList();
      });
    });
  }

  function renderList() {
    const rows = tickets.filter(matchesTab).filter(matchesQuery);
    listEl.innerHTML = rows.map((t) => {
      const last = t.messages[t.messages.length - 1];
      const active = t.id === selectedId ? "is-active" : "";
      return `
        <li>
          <button class="ticket-row ${active}" data-id="${t.id}" data-priority="${t.priority}">
            <div class="row-top">
              <span class="row-id mono">#${t.id}</span>
              <span class="row-time mono">${t.updated}</span>
            </div>
            <div class="row-subject">${t.subject}</div>
            <div class="row-snippet">${last.from === "agent" ? "Tú: " : ""}${last.text}</div>
            <div class="row-bottom">
              <span class="row-requester">${t.requester.name}</span>
              <span class="priority-dot" data-priority="${t.priority}" title="Prioridad ${PRIORITY_LABEL[t.priority]}"></span>
              <span class="pill" data-status="${t.status}">${STATUS_LABEL[t.status]}</span>
            </div>
          </button>
        </li>`;
    }).join("") || `<li style="padding:24px 16px;color:var(--ink-faint);font-size:12.5px;">Sin resultados.</li>`;

    listEl.querySelectorAll(".ticket-row").forEach((row) => {
      row.addEventListener("click", () => selectTicket(Number(row.dataset.id)));
    });
  }

  function bubbleAvatar(entry, ticket) {
    if (entry.from === "agent") return `<span class="avatar ${AGENT.avatar}">${AGENT.initials}</span>`;
    return `<span class="avatar ${ticket.requester.avatar}">${ticket.requester.initials}</span>`;
  }

  function renderDetail() {
    const t = getTicket(selectedId);
    detailEl.innerHTML = `
      <div class="detail-header">
        <button class="back-btn" id="backBtn">
          <svg width="14" height="14" viewBox="0 0 14 14"><path d="M9 2.5 4 7l5 4.5" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Tickets
        </button>
        <div class="detail-title-row">
          <div>
            <h1 class="detail-title">${t.subject}</h1>
            <div class="detail-subline"><span class="mono">#${t.id}</span> · ${t.requester.name} · actualizado ${t.updated}</div>
          </div>
        </div>
        <div class="detail-controls">
          <div class="chip-select" data-status="${t.status}">
            <select id="statusSelect" aria-label="Estado del ticket">
              ${Object.keys(STATUS_LABEL).map((k) => `<option value="${k}" ${k === t.status ? "selected" : ""}>${STATUS_LABEL[k]}</option>`).join("")}
            </select>
          </div>
          <div class="chip-select" data-priority="${t.priority}">
            <span class="priority-swatch" data-priority="${t.priority}"></span>
            <select id="prioritySelect" aria-label="Prioridad del ticket">
              ${Object.keys(PRIORITY_LABEL).map((k) => `<option value="${k}" ${k === t.priority ? "selected" : ""}>${PRIORITY_LABEL[k]}</option>`).join("")}
            </select>
          </div>
          <span class="assignee"><span class="avatar ${AGENT.avatar}" style="width:18px;height:18px;font-size:9px;">${AGENT.initials}</span>Asignado a ${AGENT.name}</span>
        </div>
      </div>

      <div class="conversation" id="conversation">
        ${t.messages.map((m) => `
          <div class="msg from-${m.from} ${m.isNote ? "is-note" : ""}">
            ${bubbleAvatar(m, t)}
            <div class="msg-body">
              <div class="msg-meta">
                <span class="msg-name">${m.from === "agent" ? AGENT.name : t.requester.name}</span>
                <span class="mono">${m.time}</span>
              </div>
              <div class="msg-bubble">${m.text}</div>
            </div>
          </div>`).join("")}
      </div>

      <form class="reply-box" id="replyForm" data-tab="${replyTab}">
        <div class="reply-tabs">
          <button type="button" class="reply-tab ${replyTab === "public" ? "is-active" : ""}" data-tab="public">Respuesta pública</button>
          <button type="button" class="reply-tab ${replyTab === "note" ? "is-active" : ""}" data-tab="note">Nota interna</button>
        </div>
        <div class="reply-field">
          <textarea id="replyText" placeholder="${replyTab === "note" ? "Escribe una nota visible solo para el equipo..." : "Escribe tu respuesta para " + t.requester.name.split(" ")[0] + "..."}"></textarea>
          <div class="reply-toolbar">
            <button type="button" class="fmt-btn" title="Negrita"><svg width="14" height="14" viewBox="0 0 14 14"><path d="M4 2.5h4a2.1 2.1 0 0 1 0 4.2H4zM4 6.7h4.4a2.1 2.1 0 0 1 0 4.3H4z" stroke="currentColor" stroke-width="1.3" fill="none" stroke-linejoin="round"/></svg></button>
            <button type="button" class="fmt-btn" title="Cursiva"><svg width="14" height="14" viewBox="0 0 14 14"><path d="M6 2.6h4M4 11.4h4M8.2 2.6 5.8 11.4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg></button>
            <button type="button" class="fmt-btn" title="Enlace"><svg width="14" height="14" viewBox="0 0 14 14"><path d="M6 8 8 6M5.3 8.7 4 10a2 2 0 1 1-2.8-2.8l1.6-1.6M8.7 5.3 10 4a2 2 0 1 1 2.8 2.8l-1.6 1.6" stroke="currentColor" stroke-width="1.3" fill="none" stroke-linecap="round"/></svg></button>
            <button type="button" class="fmt-btn" title="Adjuntar archivo"><svg width="14" height="14" viewBox="0 0 14 14"><path d="M9.5 4.2 5.6 8.1a1.8 1.8 0 0 0 2.5 2.5l4-4a3 3 0 1 0-4.2-4.2L3.7 6.6" stroke="currentColor" stroke-width="1.3" fill="none" stroke-linecap="round"/></svg></button>
          </div>
        </div>
        <div class="reply-actions">
          <button type="submit" class="send-btn" id="sendBtn" disabled>${replyTab === "note" ? "Guardar nota" : "Enviar respuesta"}</button>
        </div>
      </form>
    `;

    document.getElementById("statusSelect").addEventListener("change", (e) => {
      t.status = e.target.value;
      document.querySelector('.chip-select[data-status]').dataset.status = t.status;
      renderList();
    });
    document.getElementById("prioritySelect").addEventListener("change", (e) => {
      t.priority = e.target.value;
      const wrap = document.querySelector('.chip-select[data-priority]');
      wrap.dataset.priority = t.priority;
      wrap.querySelector(".priority-swatch").dataset.priority = t.priority;
      renderList();
    });

    detailEl.querySelectorAll(".reply-tab").forEach((btn) => {
      btn.addEventListener("click", () => {
        replyTab = btn.dataset.tab;
        renderDetail();
      });
    });

    const textarea = document.getElementById("replyText");
    const sendBtn = document.getElementById("sendBtn");
    textarea.addEventListener("input", () => {
      sendBtn.disabled = textarea.value.trim().length === 0;
    });
    document.getElementById("replyForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const text = textarea.value.trim();
      if (!text) return;
      t.messages.push({ from: "agent", time: "ahora", text, isNote: replyTab === "note" });
      if (replyTab === "public" && t.status === "new") t.status = "open";
      renderDetail();
      renderList();
    });

    const backBtn = document.getElementById("backBtn");
    if (backBtn) backBtn.addEventListener("click", () => document.body.classList.remove("detail-open"));

    const conv = document.getElementById("conversation");
    conv.scrollTop = conv.scrollHeight;
  }

  function renderContext() {
    const t = getTicket(selectedId);
    const r = t.requester;
    contextEl.innerHTML = `
      <span class="avatar ctx-avatar ${r.avatar}">${r.initials}</span>
      <h2 class="ctx-name">${r.name}</h2>
      <div class="ctx-email">${r.email}</div>
      <span class="ctx-plan">Plan ${r.plan}</span>

      <div class="ctx-section">
        <div class="ctx-label">Detalles</div>
        <dl>
          <div class="ctx-row"><dt>Empresa</dt><dd>${r.company}</dd></div>
          <div class="ctx-row"><dt>Cliente desde</dt><dd>${r.since}</dd></div>
          <div class="ctx-row"><dt>Tickets</dt><dd class="mono">${r.totalCount} · ${r.openCount} abiertos</dd></div>
        </dl>
      </div>

      <div class="ctx-section">
        <div class="ctx-label">Etiquetas</div>
        <div class="ctx-tags">${r.tags.map((tag) => `<span class="ctx-tag">${tag}</span>`).join("")}</div>
      </div>
    `;
  }

  function selectTicket(id) {
    selectedId = id;
    replyTab = "public";
    renderList();
    renderDetail();
    renderContext();
    if (window.innerWidth <= 760) document.body.classList.add("detail-open");
  }

  searchInput.addEventListener("input", (e) => {
    query = e.target.value;
    renderList();
  });

  renderTabs();
  renderList();
  renderDetail();
  renderContext();
</script>
